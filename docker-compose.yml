# Local development database for Smart Lost & Found.
#
# This is OPTIONAL. It is provided for developers who prefer containers over a
# locally installed PostgreSQL server, and to document the exact server the
# project targets (PostgreSQL 17 + PostGIS 3.6).
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:change_me@localhost:5433/smart_lost_found
#
# Port 5433 is used so the container does not clash with a local PostgreSQL on 5432.

services:
  db:
    image: postgis/postgis:17-3.6
    container_name: sllf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: smart_lost_found
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - sllf-pgdata:/var/lib/postgresql/data
      - ./database/scripts/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_lost_found"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sllf-pgdata:
